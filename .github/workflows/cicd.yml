name: CI/CD BUILD IMAGES TO AWS ECR
on:
  push:
    branches: [ main ]
  # pull_request:
    # branches: [ main ]
permissions:
  contents: read
  id-token: write   
jobs:
  build_and_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: scan with trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          exit-code: 0
          severity: CRITICAL,HIGH
      - name: Set up Docker Build
        run: docker build -t 422032869125.dkr.ecr.us-east-1.amazonaws.com/my-repo:latest .
      - name: scan docker image with trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
            image-ref: 422032869125.dkr.ecr.us-east-1.amazonaws.com/my-repo:latest
            format: table
            exit-code: 0
            severity: CRITICAL,HIGH
            ignore-unfixed: true
      - name: aws credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::422032869125:role/github-action-role
          aws-region: us-east-1
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Push the Docker image to ECR
        run: docker push 422032869125.dkr.ecr.us-east-1.amazonaws.com/my-repo:latest
        
name: MY FIRST CI/CD PIPeline # This is the name of the workflow, which will be displayed in the GitHub Actions UI
on: # This section defines the events that will trigger the workflow. In this case, it will run on every push to the main branch.
    push:
        branches: [ main ]
jobs:
    build:
        runs-on: ubuntu-latest # The job will run on the latest version of Ubuntu
        steps:
          - name: Checkout repository # This step checks out the repository so that the workflow can access its contents
            uses: actions/checkout@v4
          - name: Build image
            run: docker build -t ch00sen123/cicd-portoile1 . # This step builds a Docker image using the Dockerfile in the repository
          - name: docker login
            uses: docker/login-action@v3 # This step logs in to Docker Hub using the provided username and password
            with:
              username: ch00sen123 # The Docker Hub username is stored as a secret in the repository settings
              password: ${{ secrets.DOCKER_PASS1 }} # The Docker Hub password is also stored as a secret in the repository settings
          - name: Push image
            run: docker push ch00sen123/cicd-portoile1 # This step pushes the built Docker image to Docker Hub

name: CI/CD BUILD IMAGES TO AWS ECR
on:
  push:
    branches: [ main ]
  # pull_request:
    # branches: [ main ]
permissions:
  contents: read
  id-token: write   
jobs:
  build_and_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: scan with trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          exit-code: 0
          severity: CRITICAL,HIGH
      - name: Set up Docker Build
        run: docker build -t ${{ secrets.ECR_REPO }}/my-repo:latest .
      - name: scan docker image with trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
            image-ref: ${{ secrets.ECR_REPO }}/my-repo:latest
            format: table
            exit-code: 0
            severity: CRITICAL,HIGH
            ignore-unfixed: true
      - name: aws credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE}}
          aws-region: us-east-1
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Push the Docker image to ECR
        run: docker push ${{ secrets.ECR_REPO }}/my-repo:latest
  Deploy_to_ecs:
    runs-on: ubuntu-latest
    needs: build_and_scan

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition my-task-definition \
            --query taskDefinition > task-definition.json

      - name: Fill in new image ID
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: my-container
          image: ${{ secrets.ECR_REPO }}/my-repo:latest

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: my-ecs-service
          cluster: my-ecs-cluster
          wait-for-service-stability: true